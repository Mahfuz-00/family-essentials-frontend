<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#376847"/>
      <stop offset="100%" stop-color="#2D553A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="100" y1="50" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="100%" stop-color="#D95D3E"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2D42" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Icon Symbol Container: 180x180 centered in Y=30 -->
  <g transform="translate(30, 20)" filter="url(#subtleShadow)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#primaryGrad)"/>

    <!-- Bag & Home Outer Structure -->
    <!-- Geometric Roof Pitch + Tote Body -->
    <!-- Gable Roof Peak at (100, 38), rafters sloped down to (46, 78) and (154, 78), bag sides down to (148, 162), base (52, 162) with rounded base corners -->
    <path d="M100 38 L154 76 C158 79 160 84 158 89 L148 152 C146 160 140 166 131 166 L69 166 C60 166 54 160 52 152 L42 89 C40 84 42 79 46 76 Z" fill="#FFFFFF" fill-opacity="0.12"/>
    
    <!-- Tote Handle / Roof Truss Loop -->
    <path d="M78 68 C78 54 88 44 100 44 C112 44 122 54 122 68" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Main Solid White Bag Body with angled roofline top -->
    <path d="M100 52 L150 86 C153 88 154 91 153 95 L144 146 C143 152 138 157 131 157 L69 157 C62 157 57 152 56 146 L47 95 C46 91 47 88 50 86 Z" fill="#FFFFFF"/>

    <!-- Heart / Leaf / Checkmark Emblem Cutout / Overlay -->
    <!-- Sprout / Leaf Checkmark overlaying bottom-right in Coral Accent -->
    <path d="M84 110 L98 124 L132 88" stroke="#376847" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Coral Sprout Seed / Heart Accent -->
    <circle cx="132" cy="74" r="9" fill="url(#accentGrad)"/>
    <path d="M132 83 C138 83 144 79 144 73 C144 67 132 58 132 58 C132 58 120 67 120 73 C120 79 126 83 132 83 Z" fill="url(#accentGrad)"/>
  </g>

  <!-- Typography: Plus Jakarta Sans / Inter style geometric brand lettering -->
  <g transform="translate(265, 84)">
    <!-- Wordmark Line 1: 'Family' -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2" fill="#2B2D42">Family</text>
    <!-- Wordmark Line 1 cont: 'Essentials' -->
    <text x="146" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="500" letter-spacing="-0.8" fill="#376847">Essentials</text>

    <!-- Subtitle / Tagline Badge -->
    <rect x="0" y="52" width="168" height="24" rx="12" fill="#EBF0ED"/>
    <circle cx="10" cy="64" r="4" fill="#376847"/>
    <text x="20" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#376847" text-transform="uppercase">Household OS</text>
    
    <text x="180" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6C757D">Shared errands &amp; nursery buffer</text>
  </g>
</svg>