<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" fill="none">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#376847"/>
      <stop offset="100%" stop-color="#284E34"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28469"/>
      <stop offset="100%" stop-color="#E76F51"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#376847" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Left Emblem Container: 130x130 at (25, 25) -->
  <g transform="translate(25, 25)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="130" height="130" rx="34" fill="url(#forestGrad)" filter="url(#iconGlow)"/>
    <rect x="1.5" y="1.5" width="127" height="127" rx="33" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Two People Coming Closer / Convergence / Roof / Heart-Leaf -->
    <g transform="translate(65, 65)">
      <!-- Partner 1 (Left Head) -->
      <circle cx="-19" cy="-26" r="8.5" fill="#FFFFFF"/>
      
      <!-- Partner 2 (Right Head) -->
      <circle cx="19" cy="-26" r="8.5" fill="#FFFFFF"/>

      <!-- Aura base -->
      <path d="M -30 20 C -32 -2, -26 -16, -18 -18 C -12 -19, -6 -12, 0 -4 C 6 -12, 12 -19, 18 -18 C 26 -16, 32 -2, 30 20 C 28 32, 16 38, 0 38 C -16 38, -28 32, -30 20 Z" fill="#FFFFFF" fill-opacity="0.2"/>

      <!-- Converging Bodies & Mutual Embrace Arch (Forms roofline & shopping tote loop) -->
      <path d="M -24 16 C -26 2, -22 -10, -14 -14 C -8 -16, -3 -10, 0 -2 C 3 -10, 8 -16, 14 -14 C 22 -10, 26 2, 24 16 C 22 28, 12 34, 0 34 C -12 34, -22 28, -24 16 Z" fill="#FFFFFF"/>

      <!-- Inner Negative Space forming Heart & Leaf Sprout -->
      <path d="M 0 6 C -6 -2, -14 -2, -14 7 C -14 15, 0 24, 0 24 C 0 24, 14 15, 14 7 C 14 -2, 6 -2, 0 6 Z" fill="url(#forestGrad)"/>

      <!-- Radiant Coral Accent Center: Synchronized Heart Core -->
      <circle cx="0" cy="11" r="5" fill="url(#coralGrad)"/>
      <path d="M 0 5 C 2.2 2.5, 5 3, 5 6 C 5 8.5, 0 12, 0 12 C 0 12, -5 8.5, -5 6 C -5 3, -2.2 2.5, 0 5 Z" fill="url(#coralGrad)"/>
    </g>
  </g>

  <!-- Typography: Wordmark 'KinSync' -->
  <g transform="translate(185, 45)">
    <g>
      <text x="0" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.8" fill="#2B2D42">Kin</text>
      <text x="108" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.4" fill="#376847">Sync</text>
      <circle cx="266" cy="48" r="6" fill="#E76F51"/>
    </g>

    <!-- Subtitle Badge -->
    <g transform="translate(2, 74)">
      <rect x="0" y="0" width="186" height="24" rx="12" fill="#EBF0ED"/>
      <circle cx="10" cy="12" r="3.5" fill="#376847"/>
      <text x="20" y="16" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#376847" text-transform="uppercase">FAMILY OS &amp; ERRANDS</text>
      <text x="198" y="16.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#6C757D">Shared Logistics &amp; Home Care</text>
    </g>
  </g>
</svg>
